workflows:
  android-web:
    name: Android + Web
    instance_type: mac_mini_m2
    environment:
      groups:
        - flutter-stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Test
        script: flutter test
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build Web
        script: flutter build web --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/web/**

  ios:
    name: iOS (unsigned IPA)
    instance_type: mac_mini_m2
    environment:
      groups:
        - flutter-stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build iOS
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa

  windows:
    name: Windows desktop
    instance_type: windows_x2
    environment:
      groups:
        - flutter-stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build Windows
        script: flutter build windows --release
    artifacts:
      - build/windows/x64/runner/Release/**
